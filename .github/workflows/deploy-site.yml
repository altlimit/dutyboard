# Publish www.dutyboard.com — the marketing site, and nothing else — to an altengine static instance.
#
# dutyboard.com serves no console and knows no deployment: every DutyBoard's console is published
# to that deployment's own static site by `dutyboard --provision-only`. So this builds site/ alone,
# and runs when site/ (or what it publishes) changes.
#
# IT SKIPS UNTIL IT IS CONFIGURED. With no ALTENGINE_KEY secret the job says what is missing and
# passes, rather than painting main red for a deploy nobody has set up.
#
#   secret ALTENGINE_KEY              an API key with `write` on the static instance, and nothing
#                                     else.
#   var    ALTENGINE_STATIC_INSTANCE  the static instance (default: dutyboard)

name: deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "agent/OPERATING.md"
      - "scripts/deploy-site.mjs"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

# One deploy at a time, and never cancelled: activation is the last of three calls, and a run
# killed between the upload and the activate leaves a deployment nothing points at.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # sitegen is a Go binary, pinned: this job publishes a website, and "whatever the site
      # generator does this week" is not a thing to find out during a deploy. Bump deliberately.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: |
          go install github.com/altlimit/sitegen@v1.0.38
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # No npm install: building the site and deploy-site.mjs need only node and sitegen.
      - name: Build
        run: npm run build:site

      - id: gate
        env:
          KEY: ${{ secrets.ALTENGINE_KEY }}
        run: echo "ready=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Hashes the build, uploads only what the platform does not already have, then activates.
      - name: Deploy to altengine static
        if: steps.gate.outputs.ready == 'true'
        env:
          ALTENGINE_KEY: ${{ secrets.ALTENGINE_KEY }}
          ALTENGINE_URL: ${{ vars.ALTENGINE_URL || 'https://api.altengine.net' }}
          DUTYBOARD_STATIC_INSTANCE: ${{ vars.ALTENGINE_STATIC_INSTANCE || secrets.ALTENGINE_STATIC_INSTANCE || 'dutyboard' }}
        run: npm run deploy:site

      - name: Nothing to deploy to
        if: steps.gate.outputs.ready != 'true'
        run: echo "::notice::Built, not deployed — set the ALTENGINE_KEY secret to publish."
