# What can be checked without an altengine.
#
# The suite that matters most — scripts/smoke.mjs, 83 assertions including the cross-tenant
# matrix — needs a running altengine to talk to, so it is a local and pre-deploy gate rather
# than a step here. Writing a pipeline that pretends otherwise would mean a green tick that
# proves less than it looks like it proves.
#
# What IS here catches the things that break a deploy: a bundle that grew past the platform
# cap, a bundle carrying an import the functions service will not resolve, a console that no
# longer compiles.

name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Bundles the function and asserts what the platform requires of it: under 1MB, no
      # unresolved imports, a default export. See functions/build.mjs.
      - run: npm run build:fn

      # The console (app/, its own package in the workspace). Fails on a template error, a bad
      # import, or a component that no longer compiles — none of which the function build would
      # notice. The marketing site is built by deploy-site.yml, when site/ changes.
      - run: npm run build:app
      # The deploy folder the deploy link reads: the manifest builds from what was just built.
      - run: node scripts/build-deploy.mjs

      # Web Push encryption and VAPID signing, checked against an independent receiver. Nothing else
      # can prove them without a real browser and push service.
      - run: node scripts/webpush-check.mjs
      # The clock behind recurring duties: cron and timezone arithmetic, on its own.
      - run: node scripts/cron-check.mjs
      # The console's session: a single-use refresh token, spent by several calls at once.
      - run: node scripts/session-check.mjs
      # What agents write, rendered in the console: reports read as reports, and nothing in the
      # text becomes markup the renderer did not build.
      - run: node scripts/markdown-check.mjs
      - run: node scripts/agent-options-check.mjs
      - run: node scripts/duty-options-check.mjs
      - run: node scripts/readiness-check.mjs
      - run: node scripts/notes-check.mjs
      - run: node scripts/board-access-check.mjs
      - run: node scripts/mcp-features-check.mjs
      # A board's team: who reads a duty first, handing it on, the review gate, levels, the memory,
      # and what the console may send a machine sealed.
      - run: node scripts/roster-check.mjs
      # And what the console draws from it: the record, its ranking and the office.
      - run: node scripts/team-ui-check.mjs

      # Every script parses. They are not imported by either build, so a syntax error in one
      # would otherwise surface the first time someone ran a release step.
      - run: for f in scripts/*.mjs functions/build.mjs; do node --check "$f"; done

  cli:
    # Windows too: the release ships a Windows binary, and paths, shells and git all differ there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
        shell: bash # Git Bash on Windows
    steps:
      # The Windows runner's git checks out with CRLF; the sources and the test repositories are LF.
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: cli/go.sum
      # The provisioner's hosted path runs against a fake altengine here (internal/provision), so a
      # change that would break provisioning a real organization fails before anyone tries it.
      - run: go vet ./...
      - run: go test ./...
      # Nothing is staged, so this is the build `go install` produces: it must compile with an
      # empty embed directory.
      - run: go build -o "$RUNNER_TEMP/dutyboard" ./cmd/dutyboard

  desktop:
    # DutyBoard for the desktop (cli/desktop): the tray app that runs the daemon itself. Its own Go
    # module, because Wails asks for a newer Go and newer dependencies than the CLI should be made
    # to take. Built the way the release builds it — for Windows, from Linux, without cgo — so a
    # service the window's TypeScript no longer matches, or a resource that no longer links, fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/desktop/frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/desktop/go.mod
          cache-dependency-path: cli/desktop/go.sum
      - run: node cli/desktop/build.mjs
      - run: go vet . ./host
        working-directory: cli/desktop
        env:
          GOOS: windows
          CGO_ENABLED: "0"
      # The part with no window in it runs anywhere.
      - run: go vet ./host && go test ./host
        working-directory: cli/desktop
      # The installer's script compiles. It is only ever built for real at a release, on a Windows
      # runner, after the files it carries are signed; this catches a script that would fail there.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends nsis
      - run: |
          mkdir -p "$RUNNER_TEMP/pkg" && cp cli/desktop/dist/DutyBoard-Desktop.exe "$RUNNER_TEMP/pkg/DutyBoard.exe"
          makensis -V2 -DUNINSTALLER_ONLY -DVERSION=0.0.0 "-DSRC=$RUNNER_TEMP/pkg" cli/desktop/build/windows/installer.nsi
          # The uninstaller itself can only be written on Windows; a stand-in lets the rest compile.
          cp "$RUNNER_TEMP/pkg/make-uninstaller.exe" "$RUNNER_TEMP/pkg/Uninstall.exe"
          makensis -V2 -DVERSION=0.0.0 "-DSRC=$RUNNER_TEMP/pkg" cli/desktop/build/windows/installer.nsi

  installer:
    # The desktop installer, on Windows, where it is built for a release and where it runs: it is
    # compiled by the same script the release uses, then installed, installed again over itself, and
    # uninstalled, checking each time what it left on the machine. The Linux check above only shows the
    # script compiles there, and NSIS reads paths differently on the two — which is how a release once
    # lost its installer. The app inside is a stand-in: the installer never looks into it.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build it the way a release does
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item "$env:WINDIR\System32\whoami.exe" pkg/DutyBoard.exe
          cli/desktop/build/windows/installer.ps1 -Stage uninstaller -Version 0.0.0 -Dir pkg -Product DutyBoard-ci -RunName DutyBoard-ci
          cli/desktop/build/windows/installer.ps1 -Stage installer -Version 0.0.0 -Dir pkg -Product DutyBoard-ci -RunName DutyBoard-ci
      - name: Install, install over it, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $where = Join-Path $env:RUNNER_TEMP 'DutyBoard-ci'
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\DutyBoard-ci.lnk'
          $entry = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\DutyBoard-ci'
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          function Check($what, $ok) { if ($ok) { "  ok: $what" } else { "::error::$what"; throw $what } }

          # Someone who ran the app from elsewhere and had it start at sign-in: the entry must follow it.
          Set-ItemProperty $run -Name 'DutyBoard-ci' -Value 'C:\Elsewhere\DutyBoard-Desktop.exe --tray'
          foreach ($time in 'first', 'second') {
            $p = Start-Process pkg/DutyBoard-Setup.exe -ArgumentList '/S', "/D=$where" -Wait -PassThru
            Check "the $time install exits 0" ($p.ExitCode -eq 0)
          }
          Check 'the app is installed' (Test-Path "$where\DutyBoard.exe")
          Check 'with its uninstaller' (Test-Path "$where\Uninstall.exe")
          Check 'a Start menu shortcut' (Test-Path $shortcut)
          Check 'an installed-apps entry, with the version' ((Get-ItemProperty $entry).DisplayVersion -eq '0.0.0')
          Check 'the sign-in entry now starts the installed copy' ((Get-ItemProperty $run).'DutyBoard-ci' -eq "`"$where\DutyBoard.exe`" --tray")

          $p = Start-Process "$where\Uninstall.exe" -ArgumentList '/S', "_?=$where" -Wait -PassThru
          Check 'the uninstall exits 0' ($p.ExitCode -eq 0)
          Check 'the app is gone' (-not (Test-Path "$where\DutyBoard.exe"))
          Check 'the shortcut is gone' (-not (Test-Path $shortcut))
          Check 'the installed-apps entry is gone' (-not (Test-Path $entry))
          Check 'its sign-in entry is gone' (-not (Get-ItemProperty $run).'DutyBoard-ci')
