# Release `dutyboard` on a version tag: the binaries alt installs, and the web assets archive a
# build with nothing embedded downloads.
#
#   npm version 2.1.0 --no-git-tag-version && git commit -am "release: v2.1.0" && git tag v2.1.0 && git push --tags
#
# One version for everything: the tag, package.json, what /health reports, and what the binary
# embeds. The first step refuses a tag that disagrees with package.json, because a binary that
# provisions "v2.1.0" of a function that reports 2.0.0 would fail its own post-deploy check.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tag and package.json agree
        run: |
          want="v$(node -p 'require("./package.json").version')"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but package.json says $want"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: cli/go.sum
      - run: npm ci

      # The function and the console — what a binary provisions. Built with no VITE_* values: the
      # console is pointed at its deployment by the config.js the provisioner writes next to it.
      - run: npm run build:fn && npm run build:app
      - run: node scripts/stage-cli-assets.mjs
      - run: |
          mkdir -p release
          tar -czf "release/dutyboard-web_${GITHUB_REF_NAME#v}.tar.gz" -C cli/internal/assets/web .

      - run: go vet ./... && go test ./...
        working-directory: cli

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
