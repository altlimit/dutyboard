<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DutyBoard</title>
    <!-- Inline so the page never asks the server for an icon it does not have. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231b4fd8'/><g fill='white'><circle cx='32' cy='9' r='4'/><rect x='30.5' y='11' width='3' height='8' rx='1.5'/><rect x='11' y='18' width='42' height='32' rx='8'/></g><g fill='%231b4fd8'><rect x='16' y='24' width='8' height='10' rx='3'/><rect x='40' y='24' width='8' height='10' rx='3'/><rect x='16' y='38' width='8' height='6' rx='2'/><rect x='28' y='38' width='8' height='6' rx='2'/><rect x='40' y='38' width='8' height='6' rx='2'/></g></svg>" />
    <meta
      name="description"
      content="A coordination bus and human-in-the-loop decision engine for autonomous agents."
    />
    <meta name="theme-color" content="#f6f7f9" />
    <script>
      // Before the stylesheet, before the bundle. A saved dark preference applied after
      // the app boots is a white flash on every single load, and no amount of speed in
      // the bundle removes it — the paint has already happened.
      try {
        var t = localStorage.getItem("dutyboard.theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0f1216");
      } catch (e) {
        /* storage refused; the default theme is correct anyway */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
