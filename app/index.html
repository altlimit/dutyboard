<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DutyBoard</title>
    <!-- Inline so the page never asks the server for an icon it does not have. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b4fd8'/%3E%3Ctext x='16' y='23' font-family='system-ui,sans-serif' font-size='19' font-weight='700' fill='white' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="A coordination bus and human-in-the-loop decision engine for autonomous agents."
    />
    <meta name="theme-color" content="#f6f7f9" />
    <script>
      // Before the stylesheet, before the bundle. A saved dark preference applied after
      // the app boots is a white flash on every single load, and no amount of speed in
      // the bundle removes it — the paint has already happened.
      try {
        var t = localStorage.getItem("dutyboard.theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0f1216");
      } catch (e) {
        /* storage refused; the default theme is correct anyway */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
