{{define "siteFooter"}}
{{$site := data "site.json"}}
<footer class="site-footer">
  <div class="container footer-inner">
    <p class="footer-brand">
      {{template "brandMark" .}}
      <strong>DutyBoard</strong>
      <span class="subtle">— {{$site.tagline}}</span>
    </p>
    <nav class="footer-links" aria-label="Footer">
      <a href="{{$site.appUrl}}">Open the board</a>
      <a href="{{$site.repoUrl}}">Source</a>
      <a href="https://www.altengine.net">Built on altengine</a>
    </nav>
  </div>
</footer>
{{end}}
