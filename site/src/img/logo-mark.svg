<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DutyBoard">
  <title>DutyBoard</title>
  <!-- The mark: a robot head whose face IS the board. Three columns, five cards; the two
       top cards are the eyes, and the middle column's top slot is empty on purpose — it
       is the gap that makes a face out of a grid. The antenna sits on that column's
       centre line (x=32), which is why the empty slot reads as deliberate.

       Geometry is on a 64-unit grid with every edge on a whole (or half) unit, so the
       mark stays crisp when it is scaled down to a 32px or 16px favicon. -->
  <style>
    /* Fixed colours rather than currentColor, because this file is used as a favicon and
       an <img>, where there is no inherited colour to take. The dark pair is the app's
       own dark accent and background, so the mark matches the console it opens. */
    .db-tile { fill: #1b4fd8 }
    .db-face { fill: #ffffff }
    @media (prefers-color-scheme: dark) {
      .db-tile { fill: #7ea6ff }
      .db-face { fill: #0f1216 }
    }
  </style>

  <rect class="db-tile" width="64" height="64" rx="14"/>

  <g class="db-face">
    <circle cx="32" cy="9" r="4"/>
    <rect x="30.5" y="11" width="3" height="8" rx="1.5"/>
    <rect x="11" y="18" width="42" height="32" rx="8"/>
  </g>

  <!-- Knocked back out in the tile colour: the cards are holes in the face, not marks on
       it, which keeps the whole logo a two-colour shape. -->
  <g class="db-tile">
    <rect x="16" y="24" width="8" height="10" rx="3"/>
    <rect x="40" y="24" width="8" height="10" rx="3"/>
    <rect x="16" y="38" width="8" height="6" rx="2"/>
    <rect x="28" y="38" width="8" height="6" rx="2"/>
    <rect x="40" y="38" width="8" height="6" rx="2"/>
  </g>
</svg>
